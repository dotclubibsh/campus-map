<title>Page not found · Campus Connect</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #121318; color: #e8eaed; text-align: center;

  }
  .card { max-width: 420px; }
  svg { width: 168px; height: 168px; margin-bottom: 20px; }
  .pin { animation: hop 2.4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; transform-origin: 84px 112px; }
  .ring { animation: pulse 2.4s ease-out infinite; transform-origin: 84px 132px; }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-14px); } }
  @keyframes pulse { 0% { opacity: 0.6; transform: scale(0.6); } 100% { opacity: 0; transform: scale(1.6); } }
  h1 { font-size: 28px; line-height: 1.2; margin-bottom: 10px; }
  p { color: #9aa0a6; line-height: 1.6; margin-bottom: 24px; }
  a {
    display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px;
    border-radius: 24px; background: #4285f4; color: white; font-weight: 600; text-decoration: none;
    transition: transform 0.15s ease-out;
  }
  a:active { transform: scale(0.97); }
  a:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .pin, .ring { animation: none; } }
</style>
</head>
